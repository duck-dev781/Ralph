name: Ralph Build and Package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "LiquidCrystal I2C"
      - name: Compile Ralph
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build Ralph.ino
      - name: Prepare package
        run: |
          rm -rf package
          mkdir -p package/INO_Update package/SD_Update package/SD_Initial/RALPH/AI
          cp build/Ralph.ino.bin package/INO_Update/Ralph.bin
          cp build/Ralph.ino.bin build/Ralph-OTA.bin
          cp packages/latest/manifest.txt package/manifest.txt
          cp packages/latest/SD_Update/index.txt package/SD_Update/index.txt
          cp AI/RESPONSES.TXT package/SD_Initial/RALPH/AI/RESPONSES.TXT
          cp README.md package/README.txt
          (cd package && zip -r ../build/Ralph-Update.zip .)
      - name: Upload tamagotchi artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ralph-Tamagotchi
          path: |
            build/Ralph.ino.bin
            build/Ralph-OTA.bin
            build/Ralph-Update.zip
            package/
      - name: Publish firmware release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/Ralph-OTA.bin build/Ralph-Update.zip --title "Ralph ${GITHUB_REF_NAME}" --generate-notes
